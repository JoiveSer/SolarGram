name: SolarGram Windows (x64)

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'
  workflow_dispatch:
    inputs:
      use_test_api_credentials:
        description: 'Compile with Telegram public TEST API credentials if TDESKTOP_API_ID/HASH secrets are not set yet (test DC only)'
        required: false
        default: false
        type: boolean

concurrency:
  group: solargram-win-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: Build SolarGram.exe (Windows x64 Release)
    runs-on: windows-latest
    timeout-minutes: 360

    permissions:
      contents: read

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      QT_VERSION_PATH: "Telegram/build/qt_version.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Configure pagefile (extra virtual memory for MSVC)
        uses: al-cheb/configure-pagefile-action@v1.4
        with:
          minimum-size: 16GB
          maximum-size: 24GB
          disk-root: "D:"

      - name: Free up runner disk space
        shell: pwsh
        run: |
          $paths = @(
            "$env:ANDROID_HOME",
            "$env:ANDROID_SDK_ROOT",
            "$env:AGENT_TOOLSDIRECTORY\CodeQL",
            "$env:AGENT_TOOLSDIRECTORY\Ruby",
            "$env:AGENT_TOOLSDIRECTORY\go",
            "$env:AGENT_TOOLSDIRECTORY\Java_Temurin-Hotspot_jdk",
            "$env:ProgramFiles\Microsoft SQL Server",
            "${env:ProgramFiles(x86)}\Microsoft SQL Server",
            "$env:ProgramFiles\Docker",
            "C:\msys64",
            "C:\SeleniumWebDrivers",
            "C:\Strawberry"
          )
          foreach ($path in $paths) {
            if ($path -and (Test-Path $path)) {
              Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

      - name: Prepare short TBuild directory on D drive (147 GB free)
        run: |
          mkdir D:\TBuild\Libraries
          mkdir D:\TBuild\Temp
          mkdir D:\TBuild\NuGetCache
          mkdir D:\TBuild\PipCache
          mklink /d %GITHUB_WORKSPACE%\TBuild D:\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%
          echo TEMP=D:\TBuild\Temp>>%GITHUB_ENV%
          echo TMP=D:\TBuild\Temp>>%GITHUB_ENV%
          echo NUGET_PACKAGES=D:\TBuild\NuGetCache>>%GITHUB_ENV%
          echo PIP_CACHE_DIR=D:\TBuild\PipCache>>%GITHUB_ENV%

      - name: Get repository name
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Checkout SolarGram
        uses: actions/checkout@v4
        with:
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Initialize top-level submodules & patch for SolarGram
        shell: bash
        run: |
          cd "$TBUILD/$REPO_NAME"
          git submodule update --init --depth=1
          python Telegram/build/solar_patch_submodules.py

      - name: Compute SDK and cache keys
        shell: bash
        run: |
          DOCPATH="$TBUILD/$REPO_NAME/docs/building-win.md"
          SDK="$(grep "SDK version" "$DOCPATH" | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> "$GITHUB_ENV"

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          sha256sum "$TBUILD/$REPO_NAME/$PREPARE_PATH" "$TBUILD/$REPO_NAME/$QT_VERSION_PATH" | awk '{ print $1 }' > CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "qt6" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> "$GITHUB_ENV"

          git config --global user.email "ci@solargram.local"
          git config --global user.name "SolarGram CI"

      - name: Ensure Visual Studio 14.44 ATL component
        id: vs_atl
        shell: pwsh
        run: |
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $installer 'vswhere.exe'
          $setup = Join-Path $installer 'setup.exe'
          if (-not (Test-Path $vswhere) -or -not (Test-Path $setup)) {
            throw "Visual Studio Installer not found at $installer."
          }

          $toolsComponent = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64'
          $atlComponent = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL'
          $path = @(& $vswhere -latest -products '*' -requires $toolsComponent -property installationPath)[0]

          if (-not $path) {
            $anyPath = @(& $vswhere -latest -products '*' -property installationPath)[0]
            Write-Warning "$toolsComponent not preinstalled; probing MSVC toolsets in $anyPath."
            $msvcDir = Join-Path $anyPath 'VC\Tools\MSVC'
            $toolset = Get-ChildItem $msvcDir -Directory | Sort-Object Name -Descending | Select-Object -First 1
            if (-not $toolset) {
              throw "No MSVC toolset found under $msvcDir."
            }
            "toolset=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Using runner default MSVC toolset ($($toolset.Name))."
            exit 0
          }

          $toolset = Get-ChildItem (Join-Path $path 'VC\Tools\MSVC') -Directory `
            | Where-Object { $_.Name -like '14.44.*' } `
            | Sort-Object Name -Descending `
            | Select-Object -First 1
          if (-not $toolset) {
            "toolset=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          $header = Join-Path $toolset.FullName 'atlmfc\include\atlbase.h'
          if (-not (Test-Path $header)) {
            $process = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
              'modify',
              '--installPath', "`"$path`"",
              '--add', $atlComponent,
              '--quiet', '--norestart', '--nocache'
            )
            if ($process.ExitCode -notin @(0, 3010)) {
              throw "Visual Studio Installer exited with $($process.ExitCode)."
            }
          }
          if (-not (Test-Path $header)) {
            throw "ATL header missing at $header."
          }
          "toolset=14.44" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Using MSVC toolset 14.44 ($($toolset.Name)) with ATL ready."

      - name: Initialize Native Tools Command Prompt
        uses: Eden-CI/msvc-dev-cmd@1bd71f95d6f3d1b2b3395b335cc63bcdc90cf223
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: ${{ steps.vs_atl.outputs.toolset }}

      - name: Verify ATL headers in INCLUDE
        shell: pwsh
        run: |
          $atlInclude = Join-Path $env:VCToolsInstallDir 'atlmfc\include'
          if (-not (Test-Path (Join-Path $atlInclude 'atlbase.h'))) {
            throw "ATL header missing at $atlInclude\atlbase.h."
          }

      - name: Configure NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Restore ThirdParty cache
        id: cache-third-party
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-x64-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-third-party-

      - name: Restore Libraries cache
        id: cache-libs
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-qt6-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-qt6-

      - name: Restore Qt6 cache
        id: cache-qt
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt6-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt6-

      - name: Prepare third-party libraries (Qt6)
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent qt6

      - name: Prune intermediate build objects
        shell: bash
        run: |
          find "$LibrariesPath" '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete
          rm -rf "$TBUILD/ThirdParty/msys64/var/cache/pacman/pkg"/* || true
          rm -rf "$TBUILD/ThirdParty/rust/rustup/toolchains"/*/share/doc || true
          df -h "$TBUILD" || true

      - name: Save ThirdParty cache
        if: steps.cache-third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ steps.cache-third-party.outputs.cache-primary-key }}

      - name: Save Libraries cache
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      - name: Save Qt6 cache
        if: steps.cache-qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ steps.cache-qt.outputs.cache-primary-key }}

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Setup ccache (MSVC)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.OS }}-x64-ccache-qt6-${{ env.CACHE_KEY }}
          variant: ccache
          max-size: 2G
          create-symlink: false

      - name: Configure and build SolarGram (Release x64)
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
          USE_TEST_API: ${{ inputs.use_test_api_credentials }}
          CCACHE_COMPRESS: "1"
          CCACHE_SLOPPINESS: "pch_defines,time_macros,include_file_mtime,include_file_ctime"
        shell: pwsh
        run: |
          $repoDir = Join-Path $env:TBUILD $env:REPO_NAME
          $tgDir = Join-Path $repoDir 'Telegram'
          $outDir = Join-Path $repoDir 'out'

          $apiArgs = @()
          if ($env:TDESKTOP_API_ID -and $env:TDESKTOP_API_HASH) {
            $apiArgs = @(
              '-D', "TDESKTOP_API_ID=$($env:TDESKTOP_API_ID)",
              '-D', "TDESKTOP_API_HASH=$($env:TDESKTOP_API_HASH)"
            )
          } elseif ($env:USE_TEST_API -eq 'true') {
            Write-Warning 'TDESKTOP_API_ID/TDESKTOP_API_HASH secrets missing; building with TDESKTOP_API_TEST=ON (test DC only).'
            $apiArgs = @('-D', 'TDESKTOP_API_TEST=ON')
          } else {
            Write-Error 'Missing TDESKTOP_API_ID and TDESKTOP_API_HASH repository secrets (Settings -> Secrets and variables -> Actions). Add them from https://my.telegram.org/apps or run manually with use_test_api_credentials=true.'
            exit 1
          }

          Push-Location $tgDir
          try {
            $cfgArgs = @(
              'qt6',
              '-GNinja Multi-Config'
            ) + $apiArgs + @(
              '-D', 'CMAKE_CONFIGURATION_TYPES=Release',
              '-D', 'CMAKE_C_COMPILER_LAUNCHER=ccache',
              '-D', 'CMAKE_CXX_COMPILER_LAUNCHER=ccache',
              '-D', 'CMAKE_POLICY_DEFAULT_CMP0141=NEW',
              '-D', 'CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=',
              '-D', 'DESKTOP_APP_DISABLE_AUTOUPDATE=ON',
              '-D', 'DESKTOP_APP_DISABLE_CRASH_REPORTS=ON'
            )
            & .\configure.bat @cfgArgs
            if ($LASTEXITCODE -ne 0) {
              throw "configure.bat failed with exit code $LASTEXITCODE"
            }

            & cmake --build $outDir --config Release --parallel
            if ($LASTEXITCODE -ne 0) {
              throw "cmake --build failed with exit code $LASTEXITCODE"
            }
          } finally {
            Pop-Location
          }

      - name: Package portable SolarGram archive
        shell: pwsh
        run: |
          $repoDir = Join-Path $env:TBUILD $env:REPO_NAME
          $relDir = Join-Path $repoDir 'out\Release'
          $stageRoot = Join-Path $env:RUNNER_TEMP 'solargram-pkg'
          $stageApp = Join-Path $stageRoot 'SolarGram'
          if (Test-Path $stageRoot) { Remove-Item $stageRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $stageApp -Force | Out-Null

          $exe = Join-Path $relDir 'SolarGram.exe'
          if (-not (Test-Path $exe)) {
            throw "Expected binary not found at $exe"
          }
          Copy-Item $exe -Destination (Join-Path $stageApp 'SolarGram.exe')

          $d3d = Join-Path $relDir 'modules\x64\d3d\d3dcompiler_47.dll'
          if (Test-Path $d3d) {
            $d3dDest = Join-Path $stageApp 'modules\x64\d3d'
            New-Item -ItemType Directory -Path $d3dDest -Force | Out-Null
            Copy-Item $d3d -Destination (Join-Path $d3dDest 'd3dcompiler_47.dll')
          }

          $artifactDir = Join-Path $env:RUNNER_TEMP 'solargram-artifact'
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null
          $zipPath = Join-Path $artifactDir 'SolarGram-Windows-x64-Portable.zip'
          Compress-Archive -Path "$stageApp\*" -DestinationPath $zipPath -CompressionLevel Optimal
          Get-Item $zipPath | Format-List FullName, Length

      - name: Upload SolarGram Windows x64 Portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolarGram-Windows-x64-Portable
          path: ${{ runner.temp }}\solargram-artifact\SolarGram-Windows-x64-Portable.zip
          retention-days: 30
